services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: deviceflow
      POSTGRES_USER: deviceflow
      POSTGRES_PASSWORD: deviceflow
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deviceflow -d deviceflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ../backend
      dockerfile: Dockerfile
    env_file:
      - ../.env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.local
      DATABASE_URL: postgres://deviceflow:deviceflow@postgres:5432/deviceflow
      REDIS_URL: redis://redis:6379/0
      DEBUG: "true"
      SECRET_KEY: ${SECRET_KEY:-dev-insecure-change-me-deviceflow}
      CHANNELS_USE_REDIS: "true"
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "python manage.py migrate &&
             uvicorn config.asgi:application --host 0.0.0.0 --port 8000"
    volumes:
      - ../backend:/app

volumes:
  pgdata:
